<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unser Chat">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2c34" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Unser Chat</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" hidden>
  <main id="screens">
    <!-- CHAT -->
    <section id="tab-chat" class="screen active" aria-label="Chat">
      <header class="topbar chat-top">
        <button class="avatar" id="chat-avatar" aria-label="Info"></button>
        <button class="chat-title" id="chat-title-btn">
          <span class="name" id="chat-name"></span>
          <span class="sub" id="chat-sub"></span>
        </button>
        <button class="icon-btn" id="chat-cal-btn" aria-label="Zu Datum springen"><svg viewBox="0 0 24 24"><use href="#i-calendar"/></svg></button>
        <button class="icon-btn" id="chat-menu-btn" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><use href="#i-more"/></svg></button>
      </header>
      <div class="chat-wrap">
        <div id="chat-list" class="chat-list wallpaper"><div id="chat-inner" class="chat-inner"></div></div>
        <div id="date-pill" class="date-pill"></div>
        <div id="scrubber" class="scrubber" aria-hidden="true"><div class="track"></div><div class="thumb"></div><div class="bubble"></div></div>
        <button id="to-bottom" class="fab to-bottom" aria-label="Nach unten"><svg viewBox="0 0 24 24"><use href="#i-down"/></svg></button>
        <div id="filter-banner" class="filter-banner" hidden></div>
      </div>
    </section>

    <!-- SUCHE -->
    <section id="tab-search" class="screen" aria-label="Suche">
      <header class="topbar big"><h1>Suche</h1></header>
      <div class="search-head">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
          <input id="q" type="search" placeholder="Wörter oder „Satz in Anführungszeichen“" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
          <button id="q-clear" class="clear" aria-label="Löschen" hidden>×</button>
        </div>
        <div class="chips" id="search-filters"></div>
      </div>
      <div id="search-results" class="scroll"></div>
    </section>

    <!-- KALENDER -->
    <section id="tab-cal" class="screen" aria-label="Kalender">
      <header class="topbar big"><h1>Kalender</h1></header>
      <div id="cal-body" class="scroll"></div>
    </section>

    <!-- MOMENTE -->
    <section id="tab-moments" class="screen" aria-label="Momente">
      <header class="topbar big"><h1>Momente</h1></header>
      <div class="seg-wrap"><div class="seg" id="moments-seg">
        <button data-v="mem" class="on">Erinnerungen</button><button data-v="photos">Fotos</button><button data-v="fav">Favoriten</button>
      </div></div>
      <div id="moments-body" class="scroll"></div>
    </section>

    <!-- RÜCKBLICK -->
    <section id="tab-stats" class="screen" aria-label="Rückblick">
      <header class="topbar big"><h1>Rückblick</h1></header>
      <div class="chips scroll-x" id="stats-years"></div>
      <div id="stats-body" class="scroll"></div>
    </section>
  </main>

  <nav id="tabbar">
    <button data-tab="chat" class="on"><svg viewBox="0 0 24 24"><use href="#i-chat"/></svg><span>Chat</span></button>
    <button data-tab="search"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg><span>Suche</span></button>
    <button data-tab="cal"><svg viewBox="0 0 24 24"><use href="#i-calendar"/></svg><span>Kalender</span></button>
    <button data-tab="moments"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg><span>Momente</span></button>
    <button data-tab="stats"><svg viewBox="0 0 24 24"><use href="#i-chart"/></svg><span>Rückblick</span></button>
  </nav>
</div>

<!-- Start / Import / Sperre -->
<div id="gate" class="gate" hidden></div>
<div id="overlays"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<audio id="player" preload="none" playsinline></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M12 3.5c-5 0-9 3.4-9 7.7 0 2.3 1.2 4.4 3.1 5.8-.2 1.3-.8 2.6-1.8 3.6 2 .1 3.8-.6 5.1-1.6.8.2 1.7.3 2.6.3 5 0 9-3.4 9-7.8S17 3.5 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-8.9-9.2C2.2 8.2 4.2 5 7.4 5c2 0 3.6 1.2 4.6 2.8C13 6.2 14.6 5 16.6 5c3.2 0 5.2 3.2 4.3 6.3-1.4 4.6-8.9 9.2-8.9 9.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-8.9-9.2C2.2 8.2 4.2 5 7.4 5c2 0 3.6 1.2 4.6 2.8C13 6.2 14.6 5 16.6 5c3.2 0 5.2 3.2 4.3 6.3-1.4 4.6-8.9 9.2-8.9 9.2z" fill="currentColor"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="15" cy="15" r="1.4" fill="currentColor"/><circle cx="15" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="15" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</svg>

<!--DATA-->
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/paket.js"></script>
<script src="js/data.js"></script>
<script src="js/media.js"></script>
<script src="js/chat.js"></script>
<script src="js/search.js"></script>
<script src="js/calendar.js"></script>
<script src="js/moments.js"></script>
<script src="js/stats.js"></script>
<script src="js/intro.js"></script>
<script src="js/main.js"></script>
</body>
</html>
